# Render Blueprint: etkinlik sunucusu (API + günlük tarama). SQLite kalıcı diskte tutulur.
services:
  - type: web
    name: ne-yapsak
    runtime: node
    plan: starter          # kalıcı disk ve uyumayan servis için (aylık ~7 $)
    region: frankfurt
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: /var/data/events.db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: COLLECT_CITIES
        value: "İstanbul,Ankara,İzmir,Antalya,Bursa"
      - key: COLLECT_CRON
        value: "20 5 * * 1,4"
      - key: SEARCHES_PER_RUN
        value: "6"
